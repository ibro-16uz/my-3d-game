
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ibro Oltin 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#071426;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{border:1px solid #ffffff44;border-radius:12px;padding:12px 15px;background:#172b48;color:white;font-size:15px;font-weight:bold;touch-action:manipulation}
button:active{background:#d9a914;color:#111}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{pointer-events:auto;background:#071426dd;border:1px solid #ffffff24;border-radius:15px;padding:12px}
#top{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#brand{font-weight:bold;color:#ffd84d}
#status{font-size:12px;color:#9ce9ff;margin-top:5px}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#030916dd;padding:18px;pointer-events:auto}
#menuBox{width:min(100%,420px);text-align:center;background:#10213b;border:1px solid #ffd84d77;border-radius:22px;padding:24px 16px;box-shadow:0 0 45px #e8b92322}
h1{margin:0 0 8px;color:#ffd84d}
#modeButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
#modeButtons button{min-height:48px}
.primary{background:#e9bb2c;color:#111;border:0}
#controls{position:absolute;bottom:15px;left:12px;right:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
#moveButtons{display:grid;grid-template-columns:repeat(3,48px);gap:5px}
#moveButtons button{padding:13px 0;font-size:19px}
#moveButtons .empty{visibility:hidden}
#actions{display:flex;flex-direction:column;gap:7px}
#actions button{min-width:83px}
#hint{font-size:12px;color:#b9c8df;line-height:1.5}
.hidden{display:none!important}
@media(max-width:360px){
button{padding:10px;font-size:13px}
#moveButtons{grid-template-columns:repeat(3,40px)}
#actions button{min-width:68px}
}
</style>
</head>
<body>
<div id="hud">
  <div id="top">
    <div class="panel">
      <div id="brand">🏆 IBRO OLTIN 3D</div>
      <div id="status">3D sahna yuklanmoqda...</div>
    </div>
    <button id="menuBtn">☰ Menyu</button>
  </div>

  <div id="menu">
    <div id="menuBox">
      <h1>🏆 IBRO OLTIN</h1>
      <p>3D O‘YIN OLAMIGA XUSH KELIBSIZ!</p>
      <div id="modeButtons">
        <button data-mode="0">⚽ Futbol</button>
        <button data-mode="1">🏎️ Avtomobil</button>
        <button data-mode="2">🎯 Sarguzasht</button>
        <button data-mode="3">🏙️ Shahar</button>
        <button data-mode="4">🏆 Oltin to‘p</button>
        <button data-mode="5">🧱 Bloklar olami</button>
        <button data-mode="6" style="grid-column:1/-1">🌎 Barcha olamlar</button>
      </div>
      <button class="primary" id="playBtn" style="width:100%">▶ O‘YINNI BOSHLASH</button>
      <p id="hint">Harakat: ekrandagi tugmalar yoki klaviaturadagi WASD va strelkalar.</p>
      <div id="error" style="color:#ff9b9b;font-size:12px"></div>
    </div>
  </div>

  <div id="controls" class="hidden">
    <div id="moveButtons">
      <button class="empty">·</button>
      <button data-move="forward">▲</button>
      <button class="empty">·</button>
      <button data-move="left">◀</button>
      <button data-move="back">▼</button>
      <button data-move="right">▶</button>
    </div>
    <div id="actions">
      <button id="jumpBtn">⬆ Sakrash</button>
      <button id="nextBtn">Keyingi ➜</button>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const menu = document.getElementById('menu');
const controls = document.getElementById('controls');

let scene, camera, renderer, player, ball, car;
let world = [];
let mode = 0;
let running = false;
let jumpSpeed = 0;
let verticalSpeed = 0;
let lastTime = 0;
const keys = new Set();
const moves = new Set();

const modes = [
  {name:'Futbol', ground:0x187c3b, sky:0x7ecbff},
  {name:'Avtomobil', ground:0x303744, sky:0x92b8d7},
  {name:'Sarguzasht', ground:0x6d8539, sky:0x8fc5ff},
  {name:'Shahar', ground:0x626975, sky:0x8798b0},
  {name:'Oltin to‘p', ground:0x22213d, sky:0x342354},
  {name:'Bloklar olami', ground:0x55a85a, sky:0x91dcff},
  {name:'Barcha olamlar', ground:0x176e73, sky:0x79c9ee}
];

function makeMat(color, extra={}) {
  return new THREE.MeshStandardMaterial({color, roughness:0.8, ...extra});
}

function addBox(x,y,z,w,h,d,color) {
  const obj = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d), makeMat(color)
  );
  obj.position.set(x,y,z);
  scene.add(obj);
  world.push(obj);
  return obj;
}

function clearWorld() {
  for(const obj of world) {
    scene.remove(obj);
    obj.geometry.dispose();
    if(obj.material) obj.material.dispose();
  }
  world = [];
  if(ball) { scene.remove(ball); ball.geometry.dispose(); ball.material.dispose(); ball=null; }
  if(car) { scene.remove(car); car.geometry.dispose(); car.material.dispose(); car=null; }
  if(player) { scene.remove(player); player.geometry.dispose(); player.material.dispose(); player=null; }
}

function buildWorld() {
  clearWorld();
  const cfg = modes[mode];
  scene.background = new THREE.Color(cfg.sky);
  scene.fog = new THREE.Fog(cfg.sky, 28, 95);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(180,180),
    makeMat(cfg.ground)
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.12;
  scene.add(ground);
  world.push(ground);

  // Main platform
  addBox(0,0.03,0,10,0.2,10,mode===4?0x8d7425:0x238b70);

  // Decorative buildings / blocks
  for(let i=0;i<34;i++) {
    const h = 1.5 + Math.random()*5;
    const x = (Math.random()-0.5)*65;
    const z = (Math.random()-0.5)*65;
    if(Math.abs(x)<7 && Math.abs(z)<7) continue;
    const palette = mode===4
      ? [0xffd84d,0x8d6bca,0x393a66]
      : mode===1
      ? [0x5d6674,0x414a57,0x7d8792]
      : [0x2686ba,0x35a86b,0xf1b82d,0xdf624d];
    addBox(x,h/2,z,1.5,h,1.5,palette[i%palette.length]);
  }

  // Player
  player = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.45,1.05,4,8),
    makeMat(0xffd447, {metalness:0.15})
  );
  player.position.set(0,0.95,2);
  scene.add(player);
  world.push(player);

  if(mode===0 || mode===6) {
    ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.55,20,14),
      makeMat(0xffffff)
    );
    ball.position.set(1.8,0.58,0);
    scene.add(ball);
    world.push(ball);

    // Goal posts
    addBox(-3,1,-5,0.16,2,0.16,0xffffff);
    addBox(3,1,-5,0.16,2,0.16,0xffffff);
    addBox(0,2,-5,6,0.16,0.16,0xffffff);
  }

  if(mode===1) {
    car = new THREE.Mesh(
      new THREE.BoxGeometry(1.7,0.75,3),
      makeMat(0xe63838,{metalness:0.2})
    );
    car.position.set(0,0.55,0);
    scene.add(car);
    world.push(car);
    for(const x of [-0.9,0.9]) {
      for(const z of [-0.9,0.9]) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.32,0.32,0.2,12),
          makeMat(0x171717)
        );
        wheel.rotation.z = Math.PI/2;
        wheel.position.set(x,0.32,z);
        car.add(wheel);
      }
    }
  }

  if(mode===4) {
    const trophy = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.8,0.24,80,12),
      makeMat(0xffd32a,{metalness:0.8,roughness:0.2})
    );
    trophy.position.set(0,2,0);
    scene.add(trophy);
    world.push(trophy);
  }

  camera.position.set(0,5,10);
  camera.lookAt(0,1,0);
  statusEl.textContent = cfg.name + ' rejimi';
}

function setMode(n) {
  mode = (n + modes.length) % modes.length;
  try {
    buildWorld();
    statusEl.textContent = modes[mode].name + ' rejimi tayyor';
  } catch(e) {
    errorEl.textContent = 'Sahna yaratilmadi: ' + e.message;
  }
}

function startGame() {
  menu.classList.add('hidden');
  controls.classList.remove('hidden');
  running = true;
  statusEl.textContent = modes[mode].name + ' — o‘ynayapsiz';
}

function openMenu() {
  running = false;
  menu.classList.remove('hidden');
  controls.classList.add('hidden');
  statusEl.textContent = 'O‘yin menyusi';
}

function jump() {
  if(player && player.position.y <= 0.96) verticalSpeed = 7;
}

document.querySelectorAll('[data-mode]').forEach(btn=>{
  btn.addEventListener('click',()=>setMode(Number(btn.dataset.mode)));
});
document.getElementById('playBtn').addEventListener('click',startGame);
document.getElementById('menuBtn').addEventListener('click',openMenu);
document.getElementById('nextBtn').addEventListener('click',()=>{
  setMode(mode+1);
  startGame();
});
document.getElementById('jumpBtn').addEventListener('click',jump);

document.querySelectorAll('[data-move]').forEach(btn=>{
  const key = btn.dataset.move;
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault(); moves.add(key);
  });
  for(const ev of ['pointerup','pointercancel','pointerleave']) {
    btn.addEventListener(ev,()=>moves.delete(key));
  }
});

addEventListener('keydown',e=>{
  keys.add(e.key.toLowerCase());
  if(e.key==='Escape') openMenu();
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>{keys.clear();moves.clear();});

function update(dt) {
  if(!running || !player) return;

  const forward = keys.has('w') || keys.has('arrowup') || moves.has('forward');
  const back = keys.has('s') || keys.has('arrowdown') || moves.has('back');
  const left = keys.has('a') || keys.has('arrowleft') || moves.has('left');
  const right = keys.has('d') || keys.has('arrowright') || moves.has('right');

  const speed = mode===1 ? 7 : 4.8;
  const dx = (right?1:0) - (left?1:0);
  const dz = (back?1:0) - (forward?1:0);
  player.position.x += dx*speed*dt;
  player.position.z += dz*speed*dt;
  player.position.x = THREE.MathUtils.clamp(player.position.x,-75,75);
  player.position.z = THREE.MathUtils.clamp(player.position.z,-75,75);

  if(dx || dz) player.rotation.y = Math.atan2(dx,dz);

  verticalSpeed -= 18*dt;
  player.position.y += verticalSpeed*dt;
  if(player.position.y<0.95) {
    player.position.y=0.95;
    verticalSpeed=0;
  }

  if(ball && player.position.distanceTo(ball.position)<1.7 && (dx || dz)) {
    ball.position.x += dx*speed*dt*1.3;
    ball.position.z += dz*speed*dt*1.3;
  }

  if(car && (dx || dz)) {
    car.position.x += dx*speed*dt;
    car.position.z += dz*speed*dt;
    car.rotation.y = Math.atan2(dx,dz);
  }

  const target = new THREE.Vector3(
    player.position.x,
    player.position.y+2,
    player.position.z
  );
  const desired = new THREE.Vector3(
    player.position.x,
    player.position.y+5,
    player.position.z+9
  );
  camera.position.lerp(desired,Math.min(1,dt*4));
  camera.lookAt(target);
}

function animate(time) {
  requestAnimationFrame(animate);
  const dt = Math.min((time-lastTime)/1000 || 0.016,0.04);
  lastTime = time;
  update(dt);

  if(ball) {
    ball.rotation.x += dt;
    ball.rotation.y += dt*0.7;
  }
  renderer.render(scene,camera);
}

try {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,200);
  renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.4));
  renderer.setSize(innerWidth,innerHeight);
  document.body.prepend(renderer.domElement);
  renderer.domElement.style.position='fixed';
  renderer.domElement.style.inset='0';
  renderer.domElement.style.zIndex='0';
  document.getElementById('hud').style.zIndex='1';

  scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));
  const light = new THREE.DirectionalLight(0xffffff,2);
  light.position.set(8,15,6);
  scene.add(light);

  setMode(0);
  animate(0);
} catch(e) {
  statusEl.textContent='3D yuklanmadi';
  errorEl.textContent='Xatolik: internetni tekshiring va sahifani yangilang. '+e.message;
}

addEventListener('resize',()=>{
  if(!camera || !renderer) return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
  </html>
